[project]
name = "knowledge-graph"
version = "0.1.0"
description = "Lambda code, scripts and tests for the myeloma knowledge graph"
requires-python = ">=3.12"
dependencies = [
    "neo4j>=5,<6",
    "requests>=2,<3",
    "pyyaml>=6,<7",
    "boto3>=1.40,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
