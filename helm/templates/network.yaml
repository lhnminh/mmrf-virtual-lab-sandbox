{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-only
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}}
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
{{- if .Values.agentcore.runtimeArn }}
---
# identity calls the AgentCore API and reads the node role's credentials.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: identity-agentcore
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: identity, app.kubernetes.io/instance: {{ .Release.Name }}}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: {cidr: 169.254.169.254/32}
      ports:
        - {protocol: TCP, port: 80}
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports:
        - {protocol: TCP, port: 443}
{{- end }}
{{- end }}
